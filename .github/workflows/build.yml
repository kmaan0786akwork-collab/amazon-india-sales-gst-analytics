name: Build analysis outputs

# Re-runs the full pipeline (data -> cleaning -> notebook -> SQL -> Excel -> dashboard)
# and commits the generated files back to the repo.
on:
  push:
    branches: [main]
    paths: ["src/**", "sql/**", "notebooks/**", "requirements.txt", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Get data and clean it
        run: |
          python src/download_data.py
          python src/clean_data.py

      - name: Run the analysis notebook (writes charts to images/)
        run: |
          jupytext --to ipynb notebooks/sales_gst_analysis.py
          jupyter nbconvert --to notebook --execute --inplace notebooks/sales_gst_analysis.ipynb

      - name: SQL, Excel report and dashboard
        run: |
          python sql/run_queries.py
          python src/build_excel.py
          python src/build_dashboard.py
          curl -sSL -o docs/plotly.min.js https://raw.githubusercontent.com/plotly/plotly.js/v2.35.2/dist/plotly.min.js
          touch docs/.nojekyll
          python src/screenshot_dashboard.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs excel images notebooks sql
          git diff --cached --quiet || git commit -m "Build analysis outputs"
          git push
